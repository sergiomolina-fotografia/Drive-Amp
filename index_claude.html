<style>
  :root {
    --chrome: #2b3140;
    --light: #6d7690;
    --dark: #0d1017;
    --green: #00e000;
    --dim: #0a5a0a;
    --orange: #ff9d00;
    --mono: "VT323", "Lucida Console", "Courier New", monospace;
    --ui: "Tahoma", "Verdana", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px 10px;
    font-family: var(--ui);
    color: #c9d1d9;
    background: radial-gradient(ellipse at 50% 0%, #1a2238 0%, #0b0d12 65%);
  }
  .stack {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .win {
    background: var(--chrome);
    border: 1px solid var(--light);
    border-right-color: var(--dark);
    border-bottom-color: var(--dark);
    box-shadow: 0 0 0 1px #000, 4px 4px 0 #000;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 6px;
    user-select: none;
    background: linear-gradient(180deg, #3c5a96, #1d2c52);
    border-bottom: 1px solid #000;
    font-size: 10px;
    letter-spacing: .1em;
    color: #e6ecff;
    white-space: nowrap;
    font-weight: bold;
  }
  .title.drive-title {
    background: linear-gradient(180deg, #1b5e20, #0d3813);
    cursor: pointer;
  }
  .title.search-title {
    background: linear-gradient(180deg, #2b4570, #14223b);
    cursor: pointer;
  }
  .title.config-title {
    background: linear-gradient(180deg, #5c3b1e, #311c09);
    cursor: pointer;
  }
  .grip {
    flex: 1;
    height: 6px;
    opacity: .7;
    background: repeating-linear-gradient(180deg, var(--light) 0 1px, #000 1px 2px);
  }
  .win-btn {
    width: 12px;
    height: 12px;
    font-size: 9px;
    line-height: 10px;
    padding: 0;
    text-align: center;
    background: #353c4e;
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
    color: #fff;
    cursor: pointer;
  }
  .win-btn.close { background: #8a2020; }
  .body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lcd {
    background: #000;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    padding: 8px;
    font-family: var(--mono);
    color: var(--green);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .top {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  .timebox {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 120px;
  }
  .state {
    font-size: 16px;
    width: 18px;
    text-align: center;
  }
  .time {
    font-size: 44px;
    line-height: 1;
    letter-spacing: .04em;
    text-shadow: 0 0 6px rgba(0, 224, 0, .55);
  }
  canvas {
    flex: 1;
    min-width: 0;
    height: 44px;
    width: 100%;
    background: #000;
  }
  .marq {
    overflow: hidden;
    white-space: nowrap;
    background: #021002;
    border: 1px solid #052b05;
    padding: 2px 4px;
  }
  .marq span {
    display: inline-block;
    font-size: 19px;
    line-height: 1.1;
  }
  .marq span.scroll {
    padding-left: 100%;
    animation: sc 14s linear infinite;
  }
  @keyframes sc {
    to { transform: translateX(-100%); }
  }
  .info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--dim);
    filter: brightness(1.8);
    font-family: var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 12px;
    margin: 0;
    cursor: pointer;
    background: #000;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
  }
  input[type=range]:disabled { opacity: .5; cursor: default; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 12px;
    border-radius: 0;
    background: linear-gradient(180deg, #8d97b3, #4a5268);
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 10px;
    border-radius: 0;
    background: linear-gradient(180deg, #8d97b3, #4a5268);
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tr {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    font-family: var(--ui);
    color: #d6dcf0;
    cursor: pointer;
    border-radius: 0;
    background: linear-gradient(180deg, #4a5268, #353c4e);
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
    user-select: none;
  }
  button:hover:not(:disabled) {
    background: linear-gradient(180deg, #58617a, #3f475b);
  }
  button:active:not(:disabled), button.on {
    background: #2a3040;
    border-color: #000;
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    color: var(--green);
  }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 1px solid var(--green); outline-offset: 1px; }
  
  .tb {
    width: 34px;
    height: 24px;
    font-size: 12px;
  }
  .pill {
    height: 20px;
    padding: 0 6px;
    font-size: 9px;
    letter-spacing: .05em;
    font-weight: bold;
  }
  .drive-toggle-btn {
    height: 20px;
    padding: 0 7px;
    font-size: 9px;
    letter-spacing: .05em;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(180deg, #374256, #242c3d);
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
    color: #e2e8f0;
  }
  .drive-toggle-btn.open {
    background: #1c2b1e;
    border-color: #000;
    border-right-color: var(--green);
    border-bottom-color: var(--green);
    color: var(--green);
  }
  .drive-search-btn {
    height: 20px;
    padding: 0 7px;
    font-size: 9px;
    letter-spacing: .05em;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(180deg, #374256, #242c3d);
    border: 1px solid var(--light);
    border-right-color: #000;
    border-bottom-color: #000;
    color: #e2e8f0;
  }
  .drive-search-btn.open {
    background: #19273c;
    border-color: #000;
    border-right-color: #72a9ff;
    border-bottom-color: #72a9ff;
    color: #8bbaff;
  }
  .cfg-btn {
    height: 20px;
    padding: 0 6px;
    font-size: 9px;
    letter-spacing: .05em;
    font-weight: bold;
    background: linear-gradient(180deg, #533e2d, #322216);
    border: 1px solid #947151;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #ffd8a8;
  }
  .cfg-btn.open {
    background: #3a2211;
    border-color: #000;
    border-right-color: #ffaa55;
    border-bottom-color: #ffaa55;
    color: #ffaa55;
  }
  .check-mark {
    color: var(--green);
    font-weight: 900;
    text-shadow: 0 0 4px var(--green);
  }
  .search-mark {
    color: #72a9ff;
    font-size: 10px;
  }
  .wide {
    height: 22px;
    padding: 0 8px;
    font-size: 10px;
    white-space: nowrap;
  }
  .sm-tag-btn {
    height: 18px;
    padding: 0 6px;
    font-size: 9px;
    background: #1a2233;
    border: 1px solid #3d4a63;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #8bbaff;
    font-family: var(--mono);
  }
  .sm-tag-btn:hover {
    background: #27344e;
    color: #fff;
  }
  .vol {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9px;
    color: #7f8aa0;
  }
  .vol span { min-width: 30px; }
  
  #driveWin, #searchWin, #configWin {
    transition: all 0.2s ease;
  }
  #driveWin.collapsed, #searchWin.collapsed, #configWin.collapsed {
    display: none;
  }
  .drive-input-box {
    width: 100%;
    min-height: 58px;
    background: #000;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    color: var(--green);
    font-family: var(--mono);
    font-size: 13px;
    padding: 6px;
    resize: vertical;
    outline: none;
  }
  .drive-input-box::placeholder {
    color: #0d4a0d;
  }
  .drive-search-input, .cfg-input {
    flex: 1;
    min-width: 0;
    height: 24px;
    background: #000;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    color: var(--green);
    font-family: var(--mono);
    font-size: 13px;
    padding: 2px 6px;
    outline: none;
  }
  .cfg-select {
    height: 24px;
    background: #0d121c;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    color: #e2e8f0;
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 4px;
    outline: none;
  }
  .drive-search-input::placeholder, .cfg-input::placeholder {
    color: #0d4a0d;
  }
  .drive-status {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--orange);
    padding: 0 2px;
    min-height: 18px;
    line-height: 1.2;
  }
  .drive-bar {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-accent {
    background: linear-gradient(180deg, #1b5e20, #0e3b12);
    border: 1px solid #34a853;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #d1fae5;
    font-weight: bold;
  }
  .btn-accent:hover:not(:disabled) {
    background: linear-gradient(180deg, #24752b, #124917);
    color: #fff;
  }
  .btn-search {
    background: linear-gradient(180deg, #274574, #152745);
    border: 1px solid #4a75ba;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #d8e5ff;
    font-weight: bold;
    height: 24px;
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .btn-search:hover:not(:disabled) {
    background: linear-gradient(180deg, #375d9e, #1d355d);
    color: #fff;
  }
  .btn-cfg-test {
    background: linear-gradient(180deg, #644420, #382510);
    border: 1px solid #b37e40;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #ffeed6;
    font-weight: bold;
    height: 24px;
    padding: 0 8px;
    font-family: var(--mono);
    font-size: 11px;
  }
  
  .search-results-box {
    max-height: 170px;
    overflow-y: auto;
    background: #000;
    border: 1px solid var(--dark);
    border-right-color: var(--light);
    border-bottom-color: var(--light);
    padding: 2px;
    list-style: none;
    margin: 0;
    font-family: var(--mono);
    scrollbar-color: #4a5268 #0b0d12;
    scrollbar-width: thin;
  }
  .search-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 6px;
    border-bottom: 1px solid #141a24;
    color: #c0d4ed;
    font-size: 13px;
  }
  .search-item:hover {
    background: #0d1e38;
  }
  .search-item-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .search-item-title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--green);
    font-size: 13px;
    font-weight: bold;
  }
  .search-item-sub {
    font-size: 11px;
    color: #7f95b3;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .btn-add-result {
    height: 20px;
    padding: 0 6px;
    font-size: 10px;
    font-family: var(--mono);
    background: linear-gradient(180deg, #1b5e20, #0e3b12);
    border: 1px solid #34a853;
    border-right-color: #000;
    border-bottom-color: #000;
    color: #d1fae
